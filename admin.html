<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Mensajera de los Arcángeles</title>
<style>
:root{--suelo:#070f2e;--panel:#10286b;--panel2:#182f78;--borde:#4a5fa8;--perla:#fbf6ee;--tenue:#cfd3ee;--oro:#e6b94d;--rosa:#e7b6c9;--ok:#8fe0a0;--mal:#ff9c9c}
*{box-sizing:border-box}
body{margin:0;background:var(--suelo);color:var(--perla);font:18px/1.5 Georgia,serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.6rem;margin:0;color:var(--oro)}h2{font-size:1.25rem;margin:26px 0 10px;color:var(--oro)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
input,select{width:100%;background:var(--suelo);border:2px solid var(--borde);border-radius:12px;color:var(--perla);font:inherit;padding:11px 12px}
input:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--rosa);outline-offset:2px}
label{display:block;font-weight:700;margin:14px 0 6px}
button{font:inherit;cursor:pointer;border-radius:999px;border:0;padding:11px 18px;font-weight:700}
.b1{background:var(--oro);color:#241a05}.b2{background:var(--panel2);color:var(--perla);border:2px solid var(--borde)}
.b3{background:transparent;color:var(--mal);border:2px solid var(--mal)}
button:disabled{opacity:.5;cursor:wait}
.card{background:var(--panel);border:2px solid var(--borde);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.card.pend{border-color:var(--oro)}
.fila{display:flex;flex-wrap:wrap;gap:8px 14px;color:var(--tenue);font-size:.98rem}
.est{display:inline-block;border-radius:20px;padding:2px 12px;font-size:.92rem;font-weight:700;background:var(--panel2)}
.est.recibido{color:var(--oro)}.est.pago_verificado,.est.enviado{color:var(--ok)}.est.rechazado{color:var(--mal)}
.q{background:var(--panel2);border-radius:12px;padding:8px 12px;margin:6px 0;white-space:pre-wrap}
.acc{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.err{color:var(--mal);min-height:1.3em;margin-top:10px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{background:var(--panel);color:var(--tenue);border:2px solid var(--borde);padding:8px 14px;font-weight:400}
.tab.on{background:var(--oro);color:#241a05;border-color:var(--oro);font-weight:700}
summary.res{list-style:none;cursor:pointer;color:var(--perla)}
summary.res::-webkit-details-marker{display:none}
.l1{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.1rem}
.card[open] summary.res{border-bottom:1px solid var(--borde);padding-bottom:10px;margin-bottom:10px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--borde);border-radius:16px;padding:10px 14px;margin-bottom:8px}
.sw input{width:26px;height:26px;accent-color:var(--oro)}
details summary{cursor:pointer;color:var(--rosa);margin-top:8px}
pre{white-space:pre-wrap;background:var(--panel2);border-radius:12px;padding:10px;font:inherit;font-size:.98rem}
[hidden]{display:none!important}

/* ===== Rediseño visual: panel administrativo ===== */
:root{
  --suelo:#070d25;--panel:#111f4a;--panel2:#192d61;--borde:rgba(219,190,116,.28);
  --perla:#fffaf1;--tenue:#c7cce0;--oro:#e8c477;--rosa:#e8bfd0;--ok:#8fe0b0;--mal:#ffaaa8;
}
html{min-height:100%;background:var(--suelo)}
body{
  min-height:100vh;color:var(--perla);
  font:15px/1.6 'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:
    radial-gradient(ellipse at 12% 0%,rgba(232,196,119,.16),transparent 34%),
    radial-gradient(ellipse at 95% 28%,rgba(124,145,220,.17),transparent 32%),
    linear-gradient(145deg,#070d25 0%,#0b1534 55%,#101a3d 100%);
}
main{max-width:1040px;margin:0 auto;padding:34px 22px 72px}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.01em}
h1{font-size:clamp(2rem,4vw,2.7rem);color:var(--oro);line-height:1.05}
h2{font-size:1.8rem;color:var(--oro);margin:34px 0 12px}
#login{
  width:min(100%,470px);margin:8vh auto 0;padding:38px 34px;
  border:1px solid rgba(232,196,119,.35);border-radius:28px;
  background:linear-gradient(145deg,rgba(25,45,97,.94),rgba(12,25,61,.96));
  box-shadow:0 28px 80px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.06);
}
#login h1{text-align:center;margin-bottom:28px}
#app>.top{
  padding:18px 22px;margin-bottom:18px;border:1px solid var(--borde);
  border-radius:22px;background:rgba(17,31,74,.78);
  box-shadow:0 14px 35px rgba(0,0,0,.18)
}
#resumen{padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.045);font-size:.95rem}
input,select{
  width:100%;background:rgba(5,13,37,.72);border:1px solid rgba(190,199,229,.28);
  border-radius:13px;color:var(--perla);font:inherit;padding:13px 15px;transition:border-color .2s,box-shadow .2s
}
input:focus,select:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(232,196,119,.13)}
label{font-weight:600;margin:18px 0 7px;color:#f2dfb7}
button{font:600 .92rem 'Montserrat',system-ui,sans-serif;cursor:pointer;border-radius:999px;border:0;padding:12px 19px;transition:transform .18s,filter .18s,background .18s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.b1{background:linear-gradient(135deg,#f4dda8,#dcae52);color:#251b09;box-shadow:0 8px 22px rgba(220,174,82,.18)}
.b2{background:rgba(255,255,255,.055);color:var(--perla);border:1px solid rgba(232,196,119,.42)}
.b3{background:rgba(255,120,120,.07);color:#ffb8b4;border:1px solid rgba(255,170,168,.55)}
button:disabled{opacity:.5;cursor:wait;transform:none}
.tabs{gap:8px;margin:20px 0 14px}
.tab{background:rgba(255,255,255,.045);color:#d7dbee;border:1px solid rgba(190,199,229,.22);padding:9px 15px;font-size:.83rem}
.tab.on{background:linear-gradient(135deg,#f4dda8,#dcae52);color:#251b09;border-color:transparent}
#fBuscar{margin:2px 0 8px;max-width:560px;background:rgba(5,13,37,.58)}
.card{
  background:linear-gradient(145deg,rgba(22,39,88,.96),rgba(14,28,68,.96));
  border:1px solid rgba(168,184,231,.2);border-radius:20px;padding:20px 21px;margin:0 0 13px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);transition:border-color .2s,transform .2s
}
.card:hover{border-color:rgba(232,196,119,.45)}
.card.pend{border-color:rgba(232,196,119,.72);box-shadow:0 12px 30px rgba(0,0,0,.16),inset 3px 0 rgba(232,196,119,.65)}
.l1{font-size:1.02rem;align-items:flex-start}
.l1 b{font-size:1.08rem;overflow-wrap:anywhere}
.fila{color:#cbd2e8;font-size:.86rem;margin-top:5px}
.est{font-size:.72rem;letter-spacing:.035em;text-transform:uppercase;padding:4px 10px;background:rgba(255,255,255,.07);white-space:nowrap}
.est.recibido{color:#f2d38d;background:rgba(232,196,119,.12)}
.est.pago_verificado,.est.enviado{color:#a5edc0;background:rgba(95,205,145,.12)}
.est.rechazado{color:#ffb7b5;background:rgba(255,130,130,.12)}
.q{background:rgba(5,13,37,.34);border:1px solid rgba(255,255,255,.055);border-radius:12px;padding:11px 13px;margin:8px 0;color:#f3edf0;font-size:.9rem}
.acc{gap:9px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
.err{color:#ffaaa8;font-size:.88rem}
.sw{background:linear-gradient(145deg,rgba(22,39,88,.96),rgba(14,28,68,.96));border:1px solid rgba(168,184,231,.2);border-radius:15px;padding:13px 16px;margin-bottom:9px}
.sw span{font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--oro)}
details summary{color:#e8bfd0}
pre{background:rgba(5,13,37,.48);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:14px}
[hidden]{display:none!important}
@media(max-width:600px){
  main{padding:22px 14px 48px}
  #login{margin:5vh auto 0;padding:28px 21px;border-radius:22px}
  #app>.top{padding:15px 16px}
  .card{padding:16px;border-radius:17px}
  .l1{flex-direction:column;gap:9px}
  .acc button{flex:1 1 100%}
  .tabs{overflow-x:auto;flex-wrap:nowrap;padding:2px 1px 8px}
  .tab{flex:none}
}

</style>
</head>
<body>
<main>
<section id="login" hidden>
  <h1>Panel Mensajera de los Arcángeles</h1>
  <label for="em">Correo</label>
  <input type="email" id="em" autocomplete="username">
  <label for="pw">Clave</label>
  <input type="password" id="pw" autocomplete="current-password">
  <div class="err" id="errL" role="alert"></div>
  <button class="b1" id="entrar" style="width:100%;margin-top:8px">Entrar</button>
</section>

<section id="app" hidden>
  <div class="top"><h1>Solicitudes</h1><button class="b2" id="salir">Salir</button></div>
  <p id="resumen" style="color:var(--tenue)"></p>
  <div class="tabs" id="tabs"></div>
  <input type="search" id="fBuscar" placeholder="Buscar por nombre o correo (en todas)" aria-label="Buscar">
  <div class="err" id="err" role="alert"></div>
  <div id="lista" style="margin-top:12px"></div>
  <h2>Opciones de la página</h2>
  <p style="color:var(--tenue);font-size:.98rem">Apaga una opción y la gente verá "No disponible por ahora".</p>
  <div id="opciones"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB='https://fxmgydfhuznxrxsggqlg.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ4bWd5ZGZodXpueHJ4c2dncWxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ2NzU2MzIsImV4cCI6MjExMDI1MTYzMn0.s1N-Zq4Q6euOw5ZdP2lN-9FmhQT1TLtEIQWPDJLryVs';
const sb=supabase.createClient(SB,KEY);
const $=id=>document.getElementById(id);
const NOM={sencilla:'Mensaje de los Arcángeles',estudio:'Estudio Angelical',personal:'Consulta personal'};
let datos=[];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
const fecha=f=>new Date(f).toLocaleString('es-VE',{timeZone:'America/Caracas',dateStyle:'short',timeStyle:'short'});
const dnac=f=>f?new Date(f+'T12:00:00').toLocaleDateString('es-VE'):'—';

async function iniciar(){const{data}=await sb.auth.getSession();data.session?mostrarApp():mostrarLogin()}
function mostrarLogin(){$('login').hidden=false;$('app').hidden=true}
async function mostrarApp(){$('login').hidden=true;$('app').hidden=false;await cargar();await cargarOpciones()}
$('entrar').onclick=async()=>{
  $('errL').textContent='';const b=$('entrar');b.disabled=true;
  const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  b.disabled=false;
  if(error){$('errL').textContent='Correo o clave incorrectos.';return}
  $('pw').value='';mostrarApp();
};
$('salir').onclick=async()=>{await sb.auth.signOut();mostrarLogin()};

async function cargar(){
  $('err').textContent='';
  const{data,error}=await sb.from('arc_solicitudes').select('*').order('fecha_solicitud',{ascending:false}).limit(300);
  if(error){$('err').textContent='No se pudo cargar. Si el correo no es el de administrador, no verás nada.';return}
  datos=data;pintar();
}
$('fBuscar').oninput=pintar;
let fEst='recibido';
const ETQ={recibido:'Por verificar',pago_verificado:'Verificada',enviado:'Enviada',rechazado:'Rechazada'};
const TABS=[['urgente','Urgentes'],['recibido','Por verificar'],['pago_verificado','Verificadas'],['enviado','Enviadas'],['rechazado','Rechazadas'],['','Todas']];
const coincide=(d,k)=>k==='urgente'?d.nivel_atencion===1:(!k||d.estado===k);
function pintar(){
  const q=$('fBuscar').value.trim().toLowerCase();
  const tb=$('tabs');tb.innerHTML='';
  TABS.forEach(([k,n])=>{
    const cnt=datos.filter(d=>coincide(d,k)).length;
    const bt=el('button','tab'+(k===fEst&&!q?' on':''),n+' ('+cnt+')');
    bt.onclick=()=>{fEst=k;$('fBuscar').value='';pintar()};tb.appendChild(bt);
  });
  const pend=datos.filter(d=>d.estado==='recibido').length;
  const urg=datos.filter(d=>d.nivel_atencion===1).length;
  $('resumen').textContent=(urg?'⚠ '+urg+(urg===1?' caso urgente · ':' casos urgentes · '):'')+(pend?pend+(pend===1?' pago por verificar':' pagos por verificar'):'No hay pagos por verificar');
  $('resumen').style.color=urg?'var(--mal)':'var(--tenue)';
  const box=$('lista');box.innerHTML='';
  const f=datos.filter(d=>q?(d.nombre+' '+d.email).toLowerCase().includes(q):coincide(d,fEst));
  if(!f.length){box.appendChild(el('p','','No hay solicitudes aquí.'));return}
  f.forEach(d=>box.appendChild(tarjeta(d)));
}
function tarjeta(d){
  const c=el('details','card'+(d.estado==='recibido'||d.nivel_atencion===1?' pend':''));
  const sm=el('summary','res');
  const l1=el('div','l1');l1.append(el('b','',d.nombre),el('span','est '+(d.nivel_atencion===1?'rechazado':d.estado),d.nivel_atencion===1?'URGENTE':(ETQ[d.estado]||d.estado)));
  sm.append(l1,el('div','fila',(NOM[d.servicio]||d.servicio)+' · $'+Number(d.monto_usd)+' · '+fecha(d.fecha_solicitud)));
  c.appendChild(sm);
  if(d.monto_bs)c.appendChild(el('div','fila','Monto en Bs: '+Number(d.monto_bs).toLocaleString('es-VE')));
  c.appendChild(el('div','fila',d.email+(d.whatsapp?' · '+d.whatsapp:'')));
  c.appendChild(el('div','fila','Nació: '+dnac(d.fecha_nacimiento)));
  if(d.otra_persona_nombre)c.appendChild(el('div','fila','Otra persona: '+d.otra_persona_nombre+' ('+(d.otra_persona_parentesco||'')+') · nació: '+dnac(d.otra_persona_fecha_nacimiento)));
  c.appendChild(el('div','fila','Pago: '+(d.metodo_pago||'—')+(d.referencia_pago?' · ref. '+d.referencia_pago:'')));
  (d.preguntas||[]).forEach((p,i)=>c.appendChild(el('div','q',(i+1)+'. '+p)));
  if(d.informe_texto){const dt=el('details');dt.appendChild(el('summary','','Ver informe enviado'));dt.appendChild(el('pre','',d.informe_texto));c.appendChild(dt)}
  const a=el('div','acc');
  if(d.captura_url){
    const v=el('button','b2','Ver captura');
    v.onclick=async()=>{
      const w=window.open('','_blank');
      const{data,error}=await sb.storage.from('capturas').createSignedUrl(d.captura_url,3600);
      if(error||!data){if(w)w.close();$('err').textContent='No se pudo abrir la captura.';return}
      if(w)w.location=data.signedUrl;else location.href=data.signedUrl;
    };
    a.appendChild(v);
  }
  if(d.estado==='recibido'||d.estado==='rechazado'){const ok=el('button','b1','Verificar pago');ok.onclick=()=>cambiar(d,'pago_verificado',ok);a.appendChild(ok)}
  if(d.estado==='recibido'){const no=el('button','b3','Rechazar');no.onclick=()=>{if(confirm('¿Rechazar esta solicitud?'))cambiar(d,'rechazado',no)};a.appendChild(no)}
  if(d.estado==='pago_verificado')c.appendChild(el('div','fila','Verificado: '+fecha(d.fecha_verificacion)));
  c.appendChild(a);
  return c;
}
async function cambiar(d,estado,btn){
  btn.disabled=true;$('err').textContent='';
  const{error}=await sb.from('arc_solicitudes').update({estado}).eq('id_solicitud',d.id_solicitud);
  if(error){$('err').textContent='No se pudo cambiar el estado.';btn.disabled=false;return}
  await cargar();
}
async function cargarOpciones(){
  const{data,error}=await sb.from('arc_config_consultas').select('id,nombre,precio_usd,activo').order('orden');
  const box=$('opciones');box.innerHTML='';
  if(error||!data)return;
  data.forEach(o=>{
    const r=el('label','sw');r.style.fontWeight='400';r.style.margin='0 0 8px';
    r.appendChild(el('span','',o.nombre+' · $'+Number(o.precio_usd)));
    const k=document.createElement('input');k.type='checkbox';k.checked=o.activo;
    k.onchange=async()=>{
      k.disabled=true;
      const{error}=await sb.from('arc_config_consultas').update({activo:k.checked,updated_at:new Date().toISOString()}).eq('id',o.id);
      if(error){k.checked=!k.checked;$('err').textContent='No se pudo cambiar la opción.'}
      k.disabled=false;
    };
    r.appendChild(k);box.appendChild(r);
  });
}
iniciar();
</script>
</body>
</html>
