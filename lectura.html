<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Tu mensaje personal | Mensajera de los Arcángeles</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--perla:#fbf6ee;--caja:#f1e8f3;--linea:#dccde3;--oro:#c9962f;--oro-osc:#8a6420;--azul:#10286b;--tinta:#16214d;--suave:#5a6190;--rosa:#e7b6c9;--fs:19px;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--perla);color:var(--tinta);font-family:var(--sans);font-size:var(--fs);line-height:1.7;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.marco{max-width:720px;margin:0 auto;padding:28px 22px 10px}
.cabecera{text-align:center;padding:10px 0 8px}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--oro),0 6px 26px rgba(16,40,107,.3)}
.marca{font-family:var(--serif);font-weight:700;font-size:1.25rem;color:var(--azul);margin:12px 0 0}
h1{font-family:var(--serif);font-weight:700;font-size:2.5rem;line-height:1.1;margin:10px 0 6px;color:var(--tinta)}
.para{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.45rem;color:var(--suave);margin:0}
.para b{font-style:normal;font-weight:700;color:var(--azul);display:block;font-size:1.9rem;margin-top:2px}
.divisor{display:flex;align-items:center;gap:12px;margin:26px 0;color:var(--oro)}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--oro);opacity:.7}
.divisor svg{width:40px;height:12px}
h2{display:inline-block;font-family:var(--serif);font-weight:700;font-size:1.5rem;line-height:1.2;background:var(--azul);color:var(--perla);padding:6px 18px 8px;border-radius:999px;margin:30px 0 14px}
h3{font-family:var(--serif);font-weight:700;font-size:1.5rem;line-height:1.25;text-align:center;margin:30px 0 12px;color:var(--azul)}
p{margin:0 0 14px}
.leer{cursor:pointer;border-radius:10px;transition:background .25s}
.leer.activo{background:rgba(201,150,47,.2);box-shadow:-6px 0 0 rgba(201,150,47,.2),6px 0 0 rgba(201,150,47,.2)}
.interp{border-left:3px solid var(--rosa);padding-left:14px;margin-bottom:16px}
.apertura{font-style:italic;color:var(--suave)}
.cartas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}
.carta{background:var(--caja);border:1px solid var(--linea);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;font-size:.78em;color:var(--oro-osc);min-width:30%;flex:1 1 30%}
.carta small{display:block;font-weight:400;font-style:italic;color:var(--oro);font-size:.9em}
.calc{display:flex;gap:14px;align-items:center;background:var(--caja);border:1px solid var(--oro);border-radius:20px;padding:14px;margin:0 0 16px}
.calc .num{flex:none;width:58px;height:58px;border-radius:50%;background:var(--azul);color:var(--perla);font-family:var(--serif);font-weight:700;font-size:2rem;display:grid;place-items:center}
.calc .tx{font-size:.85em;color:var(--suave)}
.calc .tx strong{display:block;font-family:var(--serif);font-size:1.4em;color:var(--oro-osc);margin-top:4px}
.decreto{background:var(--caja);border:1px solid var(--oro);border-radius:26px;padding:22px 18px;margin:28px 0;text-align:center;outline:1px solid var(--linea);outline-offset:-6px}
.decreto h4{font-family:var(--serif);font-weight:700;font-size:1.5rem;color:var(--oro-osc);margin:4px 0 10px}
.decreto .linea{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.4rem;line-height:1.35;color:var(--tinta);margin:0 0 6px}
.decreto .nota{font-style:italic;font-size:.8em;color:var(--suave);margin:12px 0 0}
.despedida{font-family:var(--serif);font-style:italic;font-weight:600;font-size:1.55rem;line-height:1.35;text-align:center;color:var(--oro-osc);margin:26px 0 10px}
.legal{text-align:center;font-size:.7em;color:var(--suave);margin:0 0 8px}
.cierre{text-align:center;margin:34px 0 10px}
.cierre .firma{font-family:var(--serif);font-style:italic;font-weight:700;font-size:2.2rem;line-height:1.1;color:var(--azul);margin:8px 0 18px}
.btn-reservar{display:inline-block;background:linear-gradient(135deg,#f7de9c,#e6b94d 60%,#c9962f);color:#241a05;font-weight:700;font-size:1rem;text-decoration:none;padding:15px 30px;border-radius:999px}
.btn-reservar:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
.reproductor{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(251,246,238,.97);border-top:1px solid var(--oro);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}

.fila{display:flex;gap:10px}
.btn-grande{flex:1;font-family:var(--sans);font-weight:700;font-size:1.08rem;background:var(--azul);color:#fff;border:0;border-radius:999px;padding:16px 14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px}
.btn-grande svg{width:18px;height:18px;fill:currentColor}
.btn-sec{flex:none;background:var(--caja);color:var(--azul);border:1px solid var(--oro);border-radius:999px;padding:0 18px;font-weight:700;font-size:.95rem;min-height:56px;cursor:pointer;font-family:var(--sans)}
.ajustes{display:none;margin-top:12px;gap:12px;flex-wrap:wrap;align-items:flex-end;font-size:.78rem;color:var(--suave)}
.ajustes.abierto{display:flex}
.ajustes label{display:flex;flex-direction:column;gap:4px;flex:1 1 140px}
.ajustes select{font-family:var(--sans);font-size:.95rem;padding:10px;border-radius:12px;border:1px solid var(--oro);background:#fff;color:var(--tinta)}
.tam button{font-family:var(--serif);font-weight:700;background:#fff;border:1px solid var(--oro);color:var(--azul);border-radius:12px;width:46px;height:44px;font-size:1.1rem;cursor:pointer}
.aviso{text-align:center;padding:60px 22px;font-size:1.05rem;color:var(--suave)}
.sin-voz{font-size:.8rem;color:var(--suave);margin-top:8px;text-align:center}
@media (prefers-reduced-motion:reduce){.leer{transition:none}}
</style>
</head>
<body>
<main class="marco" id="app"><div class="aviso">Preparando tu mensaje…</div></main>

<div class="reproductor" id="reproductor" hidden>
  <div class="in">
    <div class="fila">
      <button class="btn-grande" id="btnPlay" type="button" aria-live="polite"></button>
      <button class="btn-sec" id="btnAjustes" type="button" aria-expanded="false" aria-controls="ajustes">Ajustes</button>
    </div>
    <div class="ajustes" id="ajustes">
      <label>Voz <select id="selVoz"></select></label>
      <label>Velocidad
        <select id="selVel">
          <option value="0.9">Lenta</option>
          <option value="1">Normal</option>
          <option value="1.12" selected>Un poco rápida</option>
          <option value="1.3">Rápida</option>
        </select>
      </label>
      <label style="flex:none">Tamaño de letra
        <span class="tam" style="display:flex;gap:8px">
          <button type="button" id="menos" aria-label="Letra más pequeña">A-</button>
          <button type="button" id="mas" aria-label="Letra más grande">A+</button>
        </span>
      </label>
    </div>
    <div class="sin-voz" id="sinVoz" hidden>Tu navegador no puede leer en voz alta. Prueba abrir este enlace en Chrome o Safari.</div>
  </div>
</div>

<script>
(function(){
"use strict";
var API="https://fxmgydfhuznxrxsggqlg.supabase.co/functions/v1/lectura-arcangeles";
var WA="https://wa.me/584160650749?text="+encodeURIComponent("Hola, estoy interesada en reservar una consulta personal de $12. ¿Me pasas los datos de pago?");
var NS="http://www.w3.org/2000/svg";
var app=document.getElementById("app"),cola=[],idx=0,hablando=false,voz=null,vel=1.12;
var soporte=("speechSynthesis" in window)&&("SpeechSynthesisUtterance" in window);

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function divisor(){
  var d=el("div","divisor");d.setAttribute("aria-hidden","true");
  var s=document.createElementNS(NS,"svg");s.setAttribute("viewBox","-20 -6 40 12");
  [[-12,2.6],[0,4.2],[12,2.6]].forEach(function(a){var r=a[1],p=document.createElementNS(NS,"path");
    p.setAttribute("d","M "+a[0]+" "+(-r)+" L "+(a[0]+r*.22)+" "+(-r*.22)+" L "+(a[0]+r)+" 0 L "+(a[0]+r*.22)+" "+(r*.22)+" L "+a[0]+" "+r+" L "+(a[0]-r*.22)+" "+(r*.22)+" L "+(a[0]-r)+" 0 L "+(a[0]-r*.22)+" "+(-r*.22)+" Z");
    p.setAttribute("fill","#c9962f");s.appendChild(p)});
  d.appendChild(s);return d;
}
function partirCartas(l){
  var s=l.replace(/^Cartas?:\s*/i,"");
  var p=s.split(/\s*[·;|]\s*/).map(function(x){return x.trim()}).filter(Boolean);
  if(p.length<2)p=s.split(/,\s+/).map(function(x){return x.trim()}).filter(Boolean);
  return p;
}
function parsear(texto){
  var limpio=texto.replace(/\s*={3}\s*HOJA\s*={3}\s*/gi,"\n\n").replace(/^\*\*(.+?)\*\*\s*$/gm,"### $1").replace(/\*/g,"").replace(/^(#{2,3})\s*$/gm,"")
    .replace(/([^\n])[ \t]+(Recuerda siempre)/i,"$1\n$2").replace(/([^\n])[ \t]+(Esta lectura es una guía)/i,"$1\n$2").replace(/^(#{2,3} .+)$/gm,"\n\n$1\n\n");
  var b=limpio.split(/\n{2,}/).map(function(x){return x.trim()}).filter(Boolean),out=[],modo="";
  for(var i=0;i<b.length;i++){
    var t=b[i];
    if(t.indexOf("## ")===0){
      var tit=t.slice(3).trim();
      if(/decreto/i.test(tit)){
        var lineas=[],notas=[],j=i+1;
        for(;j<b.length;j++){
          if(b[j].indexOf("## ")===0||b[j].indexOf("### ")===0)break;
          var ls=b[j].split("\n").map(function(x){return x.trim()}).filter(Boolean);
          if(!lineas.length)lineas=ls;else notas.push(ls.join(" "));
        }
        i=j-1;out.push({tipo:"decreto",lineas:lineas,nota:notas.join(" ")});modo="";continue;
      }
      modo=/apertura/i.test(tit)?"apertura":"";out.push({tipo:"h2",t:tit});continue;
    }
    if(t.indexOf("### ")===0){
      var preg=t.slice(4).trim(),cartas=[],cuerpo=[],k=i+1;
      for(;k<b.length;k++){
        if(b[k].indexOf("## ")===0||b[k].indexOf("### ")===0)break;
        var sueltas=[];
        b[k].split("\n").forEach(function(ln){var l=ln.trim();if(!l)return;if(/^Cartas?:/i.test(l))cartas=partirCartas(l);else sueltas.push(l)});
        if(sueltas.length)cuerpo.push(sueltas.join(" "));
      }
      i=k-1;out.push({tipo:"pregunta",t:preg,cartas:cartas,cuerpo:cuerpo});continue;
    }
    var buf=[];
    var vaciar=function(){if(buf.length){out.push({tipo:"p",t:buf.join(" "),modo:modo});buf=[]}};
    t.split("\n").map(function(x){return x.trim()}).filter(Boolean).forEach(function(l){
      if(/no tiene fronteras/i.test(l)){vaciar();out.push({tipo:"despedida",t:l.replace(/^["“”]+|["“”]+$/g,"")})}
      else if(/^Esta lectura es una guía/i.test(l)){vaciar();out.push({tipo:"legal",t:l})}
      else if(/^C[aá]lculo:/i.test(l)){vaciar();out.push({tipo:"calc",t:l})}
      else buf.push(l);
    });

  }
  return out;
}
function fragmentos(txt){
  var frases=txt.replace(/\s+/g," ").trim().match(/[^.!?…]+[.!?…]*/g)||[txt],res=[],cur="";
  frases.forEach(function(f){f=f.trim();if(!f)return;if((cur+" "+f).trim().length>220&&cur){res.push(cur);cur=f}else cur=(cur+" "+f).trim()});
  if(cur)res.push(cur);return res;
}
function registrar(e,hablado){
  e.classList.add("leer");var inicio=cola.length;
  fragmentos(hablado).forEach(function(f){cola.push({el:e,texto:f})});
  e.addEventListener("click",function(){if(soporte){idx=inicio;empezar()}});
}
function nombreCarta(c){return c.replace(/\s*\(invertida\)\s*$/i,"").trim()+(/invertida/i.test(c)?", invertida":"")}

function construir(datos){
  app.textContent="";
  var cab=el("header","cabecera");
  var img=el("img","logo");img.src="logo-arcangeles.png";img.alt="Mensajera de los Arcángeles";img.width=150;img.height=150;cab.appendChild(img);
  cab.appendChild(el("p","marca","Mensajera de los Arcángeles"));
  cab.appendChild(el("h1",null,"Tu mensaje personal"));
  var para=el("p","para","Preparado para");para.appendChild(el("b",null,datos.nombre));cab.appendChild(para);
  app.appendChild(cab);app.appendChild(divisor());
  parsear(datos.texto).forEach(function(b){
    if(b.tipo==="h2"){var h=el("h2",null,b.t);app.appendChild(h);registrar(h,b.t+".")}
    else if(b.tipo==="pregunta"){
      var h3=el("h3",null,b.t);app.appendChild(h3);registrar(h3,b.t);
      if(b.cartas.length){
        var fila=el("div","cartas");
        b.cartas.forEach(function(c){var inv=/invertida/i.test(c),d=el("div","carta",c.replace(/\s*\(invertida\)\s*$/i,"").trim());if(inv)d.appendChild(el("small",null,"invertida"));fila.appendChild(d)});
        app.appendChild(fila);registrar(fila,"Las cartas son: "+b.cartas.map(nombreCarta).join(", ")+".");
      }
      b.cuerpo.forEach(function(c){var p=el("p","interp",c);app.appendChild(p);registrar(p,c)});
    }
    else if(b.tipo==="calc"){
      var m=b.t.match(/N[uú]mero de vida:?\s*(\d+)/i)||b.t.match(/=\s*(\d+)\D*$/),num=m?m[1]:"";
      var op=b.t.replace(/^C[aá]lculo:\s*/i,"").replace(/\s*N[uú]mero de vida:.*$/i,"").trim();
      var c=el("div","calc");if(num)c.appendChild(el("div","num",num));
      var tx=el("div","tx",op.replace(/→/g,"»"));if(num)tx.appendChild(el("strong",null,"Número de vida: "+num));
      c.appendChild(tx);app.appendChild(c);
      registrar(c,"Cálculo. "+op.replace(/→|»/g,", luego ")+(num?". Número de vida: "+num+".":""));
    }
    else if(b.tipo==="decreto"){
      var box=el("section","decreto");box.appendChild(el("h4",null,"Tu decreto diario"));
      b.lineas.forEach(function(l){box.appendChild(el("p","linea",l))});
      if(b.nota)box.appendChild(el("p","nota",b.nota));
      app.appendChild(box);registrar(box,"Tu decreto diario. "+b.lineas.join(" ")+(b.nota?" "+b.nota:""));
    }
    else if(b.tipo==="despedida"){var d=el("p","despedida",b.t);app.appendChild(d);registrar(d,b.t)}
    else if(b.tipo==="legal"){app.appendChild(el("p","legal",b.t))}
    else if(b.tipo==="p"){var p2=el("p",b.modo==="apertura"?"apertura":null,b.t.replace(/^["“”]+|["“”]+$/g,""));app.appendChild(p2);registrar(p2,p2.textContent)}
  });
  app.appendChild(divisor());
  var cierre=el("section","cierre");
  cierre.appendChild(el("p",null,"Con luz,"));
  cierre.appendChild(el("p","firma","Mensajera de los Arcángeles"));
  cierre.appendChild(el("p",null,"Profundiza en tu mensaje con una consulta personal."));
  var a=el("a","btn-reservar","Reservar una consulta personal");a.href=WA;a.target="_blank";a.rel="noopener";
  cierre.appendChild(a);app.appendChild(cierre);
  iniciarReproductor();
}

var btnPlay,selVoz,selVel;
var IP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',IPA='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function pintarBoton(){
  if(hablando)btnPlay.innerHTML=IPA+"<span>Pausar</span>";
  else if(idx>0&&idx<cola.length)btnPlay.innerHTML=IP+"<span>Continuar escuchando</span>";
  else btnPlay.innerHTML=IP+"<span>Escuchar mi mensaje</span>";
  btnPlay.setAttribute("aria-label",hablando?"Pausar la lectura":"Escuchar la lectura en voz alta");
}
function marcar(e){
  var prev=document.querySelector(".leer.activo");if(prev&&prev!==e)prev.classList.remove("activo");
  if(e){e.classList.add("activo");try{e.scrollIntoView({behavior:"smooth",block:"center"})}catch(x){e.scrollIntoView()}}
}
function desmarcar(){var prev=document.querySelector(".leer.activo");if(prev)prev.classList.remove("activo")}
function hablar(){
  if(!hablando)return;
  if(idx>=cola.length){hablando=false;idx=0;desmarcar();pintarBoton();return}
  var it=cola[idx];marcar(it.el);
  var u=new SpeechSynthesisUtterance(it.texto);
  u.lang=voz?voz.lang:"es-ES";if(voz)u.voice=voz;u.rate=vel;u.pitch=1;
  var seguir=function(){if(!hablando)return;idx++;hablar()};
  u.onend=seguir;
  u.onerror=function(e){if(e&&(e.error==="interrupted"||e.error==="canceled"))return;seguir()};
  window.speechSynthesis.speak(u);
}
function empezar(){window.speechSynthesis.cancel();hablando=true;pintarBoton();hablar()}
function pausar(){hablando=false;window.speechSynthesis.cancel();pintarBoton()}

var NH=/jorge|juan|diego|carlos|pablo|ra[uú]l|[aá]lvaro|enrique|miguel|andr[eé]s|alberto|antonio|sergio|ricardo|emilio|gonzalo|jaime|luis|pedro|rodrigo|male|masculin|hombre|david|daniel|eduardo|fernando|francisco|javier|mateo|santiago|tom[aá]s/i;
var NM=/m[oó]nica|paulina|helena|laura|luc[ií]a|sabina|marisol|francisca|female|femenin|mujer|paloma|esperanza|ang[eé]lica|carmen|elena|mar[ií]a|sof[ií]a|valentina|isabela|camila|marta|in[eé]s|dalia|elvira|salom[eé]|catalina|lupe|soledad|rosa|ana\b/i;
function esMujer(v){return NM.test(v.name)||!NH.test(v.name)&&/female|femenin/i.test(v.name)}
function esHombre(v){return NH.test(v.name)&&!NM.test(v.name)}
function cargarVoces(){
  var es=(window.speechSynthesis.getVoices()||[]).filter(function(v){return /^es([-_]|$)/i.test(v.lang)});
  var pref=function(v){var s=0,n=v.name+" "+v.lang;
    if(esMujer(v))s+=12;else if(esHombre(v))s-=6;
    if(/es[-_](MX|US|419)/i.test(v.lang))s+=4;else if(/es[-_]ES/i.test(v.lang))s+=2;
    if(/natural|neural|premium|enhanced|mejorad|siri/i.test(n))s+=5;
    if(/google/i.test(n))s+=2;if(v.localService===false)s+=1;return s};
  es.sort(function(a,b){return pref(b)-pref(a)});
  var guardada=null;try{guardada=localStorage.getItem("voz")}catch(e){}
  selVoz.textContent="";
  if(!es.length){selVoz.appendChild(el("option",null,"Voz del teléfono"));voz=null;return}
  es.forEach(function(v,i){var o=el("option",null,v.name+" ("+v.lang+")"+(esMujer(v)?" - voz de mujer":""));o.value=String(i);selVoz.appendChild(o)});
  var elegida=0;if(guardada)es.forEach(function(v,i){if(v.name===guardada)elegida=i});
  selVoz.value=String(elegida);voz=es[elegida];
  selVoz.onchange=function(){voz=es[Number(selVoz.value)];try{localStorage.setItem("voz",voz.name)}catch(e){}if(hablando)empezar()};
}
function iniciarReproductor(){
  document.getElementById("reproductor").hidden=false;
  btnPlay=document.getElementById("btnPlay");selVoz=document.getElementById("selVoz");selVel=document.getElementById("selVel");
  if(!soporte){btnPlay.style.display="none";document.getElementById("sinVoz").hidden=false;document.getElementById("btnAjustes").style.flex="1"}
  else{
    pintarBoton();
    btnPlay.addEventListener("click",function(){if(hablando)pausar();else empezar()});
    cargarVoces();
    if(window.speechSynthesis.onvoiceschanged!==undefined)window.speechSynthesis.onvoiceschanged=cargarVoces;
    selVel.onchange=function(){vel=Number(selVel.value);if(hablando)empezar()};
    window.addEventListener("pagehide",function(){window.speechSynthesis.cancel()});
  }
  var aj=document.getElementById("ajustes"),ba=document.getElementById("btnAjustes");
  ba.addEventListener("click",function(){var ab=aj.classList.toggle("abierto");ba.setAttribute("aria-expanded",String(ab))});
  var tam=19;try{tam=Number(localStorage.getItem("tam"))||19}catch(e){}
  function poner(n){tam=Math.max(16,Math.min(30,n));document.documentElement.style.setProperty("--fs",tam+"px");try{localStorage.setItem("tam",String(tam))}catch(e){}}
  poner(tam);
  document.getElementById("mas").onclick=function(){poner(tam+2)};
  document.getElementById("menos").onclick=function(){poner(tam-2)};
}

var id=new URLSearchParams(location.search).get("id")||"";
function aviso(msg){app.textContent="";app.appendChild(el("div","aviso",msg))}
if(!/^[0-9a-f-]{36}$/i.test(id)){aviso("Este enlace no es válido. Abre el enlace que viene en tu PDF o en tu correo.");return}
fetch(API+"?id="+encodeURIComponent(id))
  .then(function(r){if(r.status===410)throw new Error("vencido");if(!r.ok)throw new Error("no");return r.json()})
  .then(construir)
  .catch(function(e){aviso(e.message==="vencido"?"Este enlace ya venció. Escríbenos por WhatsApp si necesitas tu mensaje de nuevo.":"No encontramos tu mensaje. Revisa que el enlace esté completo o escríbenos por WhatsApp.")});
})();
</script>
